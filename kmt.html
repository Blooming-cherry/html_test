<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>联系我与申请入口</title>
  <style>
    :root {
      color-scheme: light;
      --page-bg: #f0f8fa;
      --surface: #ffffff;
      --text: #182a2c;
      --muted: #5a7779;
      --primary: #2a778c;
      --primary-hover: #245f71;
      --border: #c9d7d8;
      --focus: rgba(52, 146, 169, 0.35);
      --shadow: 0 12px 32px rgba(24, 42, 44, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 20px;
      background: var(--page-bg);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
    }

    .page {
      width: min(100%, 720px);
      margin: 0 auto;
      padding: clamp(24px, 5vw, 48px);
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .section-title {
      margin: 0 0 8px;
      font-size: clamp(1.7rem, 4vw, 2.2rem);
      line-height: 1.2;
    }

    .lead {
      margin: 0 0 28px;
      color: var(--muted);
    }

    .contact-form {
      display: grid;
      gap: 18px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field label {
      font-weight: 600;
    }

    .field input,
    .field textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      font: inherit;
    }

    .field textarea {
      min-height: 140px;
      resize: vertical;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: var(--primary);
      outline: 3px solid var(--focus);
      outline-offset: 1px;
    }

    .form-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .btn {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      padding: 10px 18px;
      border: 1px solid var(--primary);
      border-radius: 999px;
      background: var(--primary);
      color: #fff;
      font: inherit;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      background: var(--primary-hover);
      box-shadow: 0 4px 12px rgba(24, 42, 44, 0.16);
      transform: translateY(-1px);
    }

    .btn:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .btn--ghost {
      background: transparent;
      color: var(--primary);
    }

    .btn--ghost:hover {
      background: var(--page-bg);
      color: var(--primary-hover);
    }

    .application {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 32px;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--page-bg);
    }

    .application p {
      margin: 4px 0 0;
      color: var(--muted);
    }

    .back-link {
      display: inline-block;
      margin-top: 24px;
      color: var(--primary);
    }

    @media (max-width: 520px) {
      body {
        padding: 20px 12px;
      }

      .application {
        align-items: flex-start;
      }

      .application .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1 class="section-title">联系我</h1>
    <p class="lead">如果你对我的项目感兴趣，或者想一起学习 Web 开发，欢迎给我留言。</p>

    <form class="contact-form" action="#" method="get">
      <div class="field">
        <label for="name">姓名</label>
        <input type="text" id="name" name="name" placeholder="请输入你的姓名" required>
      </div>
      <div class="field">
        <label for="email">邮箱</label>
        <input type="email" id="email" name="email" placeholder="name@example.com" required>
      </div>
      <div class="field">
        <label for="subject">主题</label>
        <input type="text" id="subject" name="subject" placeholder="例如：想和你交流一下作品集页面" required>
      </div>
      <div class="field">
        <label for="message">留言内容</label>
        <textarea id="message" name="message" rows="6" placeholder="写下你想说的话..." required></textarea>
      </div>
      <div class="form-actions">
        <button class="btn" type="submit">发送留言</button>
        <button class="btn btn--ghost" type="reset">清空重填</button>
      </div>
    </form>

    <section class="application" aria-labelledby="application-title">
      <div>
        <h2 id="application-title">申请入口</h2>
        <p>点击按钮前往外部网站。</p>
      </div>
      <a class="btn" href="https://vmj.kmt.org.tw/">打开申请入口</a>
    </section>

    <a class="back-link" href="index.html">返回上一页</a>
  </main>
</body>
</html>
